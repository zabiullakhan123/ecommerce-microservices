name: ecommerce

x-app-env: &app-env
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_HOST: postgres
  DB_USER: shop
  DB_PASSWORD: shop

x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  discovery-server:
    condition: service_started

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------- platform ----------------
  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-server

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on: [discovery-server]
    restart: on-failure

  # ---------------- business services ----------------
  product-service:
    build: { context: ., args: { MODULE: product-service } }
    environment: *app-env
    depends_on: *app-deps
    restart: on-failure

  inventory-service:
    build: { context: ., args: { MODULE: inventory-service } }
    environment: *app-env
    depends_on: *app-deps
    restart: on-failure

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8082:8082"]   # exposed to inspect /actuator/circuitbreakers
    environment: *app-env
    depends_on: *app-deps
    restart: on-failure

  payment-service:
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      <<: *app-env
      PAYMENT_MAX_AMOUNT: "150000"
      PAYMENT_FAILURE_RATE: "0.0"
    depends_on: *app-deps
    restart: on-failure

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
